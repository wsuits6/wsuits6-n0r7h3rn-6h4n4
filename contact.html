<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with us for more information about Northern Ghana.">
    <meta name="keywords" content="Contact, Northern Ghana, Tourism, Culture">
    <meta name="robots" content="index, follow">
    <title>Contact Us - Northern Ghana</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Refresh</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Content -->
    <section class="contact-section">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Have any questions, feedback, or need more details? Reach out to us below.</p>
        </div>
    </section>

    <!-- Contact Forms -->
    <section class="form-section">
        <div class="form-container">
            <!-- Create Account -->
            <div class="form-box create-account">
                <h2>Create Account</h2>
                <form method="POST">
                    <label for="name">Name:</label>
                    <input type="text" id="name" class="input-field">

                    <label for="email">Email:</label>
                    <input type="email" id="email" class="input-field" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" class="input-field" required>

                    <label for="confirm-password">Confirm Password:</label>
                    <input type="password" id="confirm-password" class="input-field" required>

                    <button type="submit" class="btn">Sign Up</button>
                </form>
            </div>

            <!-- Login -->
            <div class="form-box login">
                <h2>Login</h2>
                <form method="POST">
                    <label for="username">Username:</label>
                    <input type="text" id="username" class="input-field" required>

                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" class="input-field" required>

                    <button type="submit" class="btn">Login</button>
                </form>
            </div>
        </div>
    </section>

</body>
</html>
